26.9" y="146.5" class="ann" text-anchor="start" fill="#a83a34">25.4 % overshoot</text><text x="88" y="508" class="sub">Damped, not oscillating: each rebound is a fraction of the one before, and both are flat by 18 us.</text><text x="88" y="525" class="sub">2.2 uF is a test load, not a cable — speaker cable runs about 100 pF per metre, so a 3 m lead is some 300 pF.</text><text x="32" y="282" class="axl" text-anchor="middle" transform="rotate(-90 32 282)">% OF FINAL VALUE</text><text x="441" y="482" class="axl" text-anchor="middle">MICROSECONDS AFTER THE EDGE</text></svg>